
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Spring Cátedra</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101d35, #28558a);
        }

        .login {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0,0,0,.2);
        }

        h1 { margin: 0 0 8px; color: #172b4d; }
        .subtitle { color: #697586; margin-bottom: 28px; }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #3979c2;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="login">
        <h1>Bienvenido</h1>
        <p class="subtitle">Inicia sesión en Spring Cátedra</p>

        <form id="loginForm">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario"
                   placeholder="Ingresa tu usuario" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password"
                   type="password"
                   placeholder="Ingresa tu contraseña" required>

            <button type="submit">Ingresar</button>
        </form>

        <p class="message" id="mensaje">
            Sistema de gestión académica
        </p>
    </main>

    
<script>
    document.getElementById("loginForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const password = document.getElementById("password").value;
            const mensaje = document.getElementById("mensaje");

            mensaje.textContent = "Verificando usuario...";

            try {
                const respuesta = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        usuario: usuario,
                        password: password
                    })
                });

                if (!respuesta.ok) {
                    mensaje.textContent =
                        "Usuario o contraseña incorrectos.";
                    return;
                }

                const datos = await respuesta.json();

                sessionStorage.setItem("token", datos.token);
                sessionStorage.setItem("usuario", datos.username);
                sessionStorage.setItem("rol", datos.rol);

                mensaje.style.color = "green";
                mensaje.textContent =
                    "¡Bienvenido, " + datos.username + "!";

            } catch (error) {
                mensaje.textContent =
                    "No se pudo conectar con el servidor.";
            }
        });
</script>

</body>
</html>
